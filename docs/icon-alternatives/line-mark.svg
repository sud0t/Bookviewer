<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- background: deep teal falling to near-black -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="488">
      <stop offset="0" stop-color="#1B575E"/>
      <stop offset="0.55" stop-color="#0E2E33"/>
      <stop offset="1" stop-color="#051012"/>
    </linearGradient>
    <!-- soft light behind the eye -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="256" cy="170" r="250">
      <stop offset="0" stop-color="#48B8C0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#48B8C0" stop-opacity="0"/>
    </radialGradient>
    <!-- hairline edge light on the tile -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="488">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <!-- glyph: white, cooling very slightly toward the bottom -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="105" x2="0" y2="407">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8E8"/>
    </linearGradient>
    <!-- the one accent: amber iris -->
    <linearGradient id="iris" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="212">
      <stop offset="0" stop-color="#FFC552"/>
      <stop offset="1" stop-color="#FF9814"/>
    </linearGradient>
    <!-- soft drop shadow under the whole glyph -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the upper lid's shadow on the iris, kept inside the iris -->
    <clipPath id="irisClip"><circle cx="256" cy="170" r="42"/></clipPath>
    <filter id="soft" filterUnits="userSpaceOnUse" x="96" y="70" width="320" height="200">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glow)"/>
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- mark: everything is symmetric about x=256; one stroke weight (30), one corner radius (22) -->
  <g filter="url(#shadow)">
    <!-- iris and pupil, tucked under the upper lid -->
    <circle cx="256" cy="170" r="42" fill="url(#iris)"/>
    <g clip-path="url(#irisClip)">
      <path d="M156,188 C180.31,162.82 206,128 256,128 C306,128 331.69,162.82 356,188" fill="none" stroke="#6B2E00" stroke-opacity="0.4" stroke-width="30" stroke-linecap="round" filter="url(#soft)"/>
    </g>
    <circle cx="256" cy="170" r="19" fill="#081A1D"/>

    <g fill="none" stroke="url(#ink)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <!-- open book: the page tops run inward, turn down into the gutter and become the lower lid -->
      <path d="M256,392 C210.09,367.59 198,356 128,356 A22,22 0 0 1 106,334 V202 A22,22 0 0 1 128,180 H146.66 A22,22 0 0 1 162.49,186.72 C180.31,205.18 206,240 256,240 C306,240 331.69,205.18 349.51,186.72 A22,22 0 0 1 365.34,180 H384 A22,22 0 0 1 406,202 V334 A22,22 0 0 1 384,356 C314,356 301.91,367.59 256,392 Z"/>
      <!-- upper lid: the mirror image of the lower lid about y=180 -->
      <path d="M156,180 C180.31,154.82 206,120 256,120 C306,120 331.69,154.82 356,180"/>
      <!-- spine: from the bottom of the valley to the foot of the book -->
      <path d="M256,240 V392"/>
    </g>
  </g>
</svg>
