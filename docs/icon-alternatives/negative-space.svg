<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="24" x2="0" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262272"/>
      <stop offset="1" stop-color="#0b0926"/>
    </linearGradient>
    <linearGradient id="pl" x1="0" y1="125" x2="0" y2="363" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f2ff"/>
    </linearGradient>
    <linearGradient id="pr" x1="0" y1="125" x2="0" y2="363" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6e4fd"/>
      <stop offset="1" stop-color="#d6d3f8"/>
    </linearGradient>
    <linearGradient id="il" x1="0" y1="180" x2="0" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd15c"/>
      <stop offset="1" stop-color="#ffae33"/>
    </linearGradient>
    <linearGradient id="ir" x1="0" y1="180" x2="0" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa52e"/>
      <stop offset="1" stop-color="#f58414"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <radialGradient id="glow" cx="256" cy="244" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a53e0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5a53e0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="right">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
  </defs>
  <!-- BookViewer: the open book is the eye. Symmetric about x=256; each shape is
       drawn once in its lit (left) tone and once, clipped to the right page, in
       its shaded tone, so the fold of the spine runs through pages, cover and iris. -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glow)"/>
  <!-- cover (lower lid), with a soft shadow beneath it -->
  <path d="M256 192C277.31 164.72 290.48 155.61 320 165.58A222.18 222.18 0 0 1 418 232L418 300A222.18 222.18 0 0 1 256 378A222.18 222.18 0 0 1 94 300L94 232A222.18 222.18 0 0 1 192 165.58C221.52 155.61 234.69 164.72 256 192Z" transform="translate(0 14)" fill="#05041a" stroke="#05041a" stroke-width="14" stroke-linejoin="round" opacity="0.45" filter="url(#soft)"/>
  <path d="M256 192C277.31 164.72 290.48 155.61 320 165.58A222.18 222.18 0 0 1 418 232L418 300A222.18 222.18 0 0 1 256 378A222.18 222.18 0 0 1 94 300L94 232A222.18 222.18 0 0 1 192 165.58C221.52 155.61 234.69 164.72 256 192Z" fill="#6c65e6" stroke="#6c65e6" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 192C277.31 164.72 290.48 155.61 320 165.58A222.18 222.18 0 0 1 418 232L418 300A222.18 222.18 0 0 1 256 378A222.18 222.18 0 0 1 94 300L94 232A222.18 222.18 0 0 1 192 165.58C221.52 155.61 234.69 164.72 256 192Z" fill="#4f49c4" stroke="#4f49c4" stroke-width="14" stroke-linejoin="round" clip-path="url(#right)"/>
  <!-- pages: lids are circular arcs, rolling into the gutter at the spine -->
  <path d="M256 170C277.31 142.72 290.48 133.61 320 143.58A222.18 222.18 0 0 1 418 210L418 278A222.18 222.18 0 0 1 320 344.42C290.48 354.39 277.31 345.28 256 318C234.69 345.28 221.52 354.39 192 344.42A222.18 222.18 0 0 1 94 278L94 210A222.18 222.18 0 0 1 192 143.58C221.52 133.61 234.69 142.72 256 170Z" fill="url(#pl)" stroke="url(#pl)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 170C277.31 142.72 290.48 133.61 320 143.58A222.18 222.18 0 0 1 418 210L418 278A222.18 222.18 0 0 1 320 344.42C290.48 354.39 277.31 345.28 256 318C234.69 345.28 221.52 354.39 192 344.42A222.18 222.18 0 0 1 94 278L94 210A222.18 222.18 0 0 1 192 143.58C221.52 133.61 234.69 142.72 256 170Z" fill="url(#pr)" stroke="url(#pr)" stroke-width="14" stroke-linejoin="round" clip-path="url(#right)"/>
  <!-- iris, pupil and glint, centred on the spine -->
  <circle cx="256" cy="244" r="64" fill="url(#il)"/>
  <circle cx="256" cy="244" r="64" fill="url(#ir)" clip-path="url(#right)"/>
  <circle cx="256" cy="244" r="31" fill="#1a1648"/>
  <circle cx="256" cy="244" r="31" fill="#110e33" clip-path="url(#right)"/>
  <circle cx="237" cy="225" r="11" fill="#ffffff"/>
</svg>
