<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Book content is rendered in blob: iframes, which inherit this policy:
      no script from a book ever runs, and nothing loads from the network
      except Wikipedia thumbnails in the lookup popover.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob: book:; img-src 'self' data: blob: book: https://*.wikimedia.org; font-src 'self' data: blob: book:; media-src 'self' data: blob: book:; connect-src 'self' data: blob: book:; frame-src blob:; worker-src 'self' blob:; base-uri book:; form-action 'none'"
    />
    <title>BookViewer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
