<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#22D0F5"/>
      <stop offset="0.46" stop-color="#3D6CFA"/>
      <stop offset="1" stop-color="#9233EC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="150" cy="40" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="24" x2="0" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pageL" x1="256" y1="0" x2="96" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9C1F4"/>
      <stop offset="0.09" stop-color="#E6EAFF"/>
      <stop offset="0.36" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F3FF"/>
    </linearGradient>
    <linearGradient id="pageR" x1="256" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9C1F4"/>
      <stop offset="0.09" stop-color="#E6EAFF"/>
      <stop offset="0.36" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F3FF"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="140" x2="0" y2="381" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF1FF"/>
      <stop offset="1" stop-color="#D3DAFF"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="150" x2="0" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9D3FF"/>
      <stop offset="1" stop-color="#9FA9F8"/>
    </linearGradient>

    <linearGradient id="socket" x1="0" y1="211" x2="0" y2="309" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#130C58"/>
      <stop offset="0.55" stop-color="#231A92"/>
      <stop offset="1" stop-color="#3023B0"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="205" x2="0" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7B0EC"/>
      <stop offset="0.5" stop-color="#D5DBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="iris" cx="256" cy="255" r="49" gradientUnits="userSpaceOnUse">
      <stop offset="0.36" stop-color="#C6FEFF"/>
      <stop offset="0.6" stop-color="#34D8FC"/>
      <stop offset="0.84" stop-color="#3A7CFF"/>
      <stop offset="1" stop-color="#5A3EEA"/>
    </radialGradient>
    <radialGradient id="irisLight" cx="262" cy="292" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8FFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E8FFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lidShade" x1="0" y1="208" x2="0" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#150C66" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#150C66" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="255" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0.52" stop-color="#58E0FF" stop-opacity="0.62"/>
      <stop offset="0.78" stop-color="#4A8BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4A8BFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="almond">
      <path d="M152 264 C204 194 308 194 360 264 C308 324 204 324 152 264 Z"/>
    </clipPath>
    <clipPath id="irisClip">
      <circle cx="256" cy="255" r="49"/>
    </clipPath>

    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16" result="b"/>
      <feFlood flood-color="#1C0E80" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#sheen)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- book -->
  <g filter="url(#bookShadow)" transform="translate(0 -8)">
    <path fill="url(#cover)" d="M256 198 C234 164 164 140 104 156 Q84 161.3 84 181.3 L84 332.3 Q84 357.3 104 352 C164 336 234 360 256 394 C278 360 348 336 408 352 Q428 357.3 428 332.3 L428 181.3 Q428 161.3 408 156 C348 140 278 164 256 198 Z"/>
    <path fill="url(#stack)" d="M256 191 C234 157 167 133 109 149 Q90 154.2 90 173.2 L90 326.2 Q90 350.2 109 345 C167 329 234 353 256 387 C278 353 345 329 403 345 Q422 350.2 422 326.2 L422 173.2 Q422 154.2 403 149 C345 133 278 157 256 191 Z"/>
    <path fill="url(#pageL)" d="M256 184 C234 150 170 126 114 142 Q96 147.1 96 165.1 L96 320.1 Q96 343.1 114 338 C170 322 234 346 256 380 Z"/>
    <path fill="url(#pageR)" d="M256 184 C278 150 342 126 398 142 Q416 147.1 416 165.1 L416 320.1 Q416 343.1 398 338 C342 322 278 346 256 380 Z"/>
  </g>

  <!-- eye -->
  <g transform="translate(0 -4)">
    <path fill="url(#bevel)" d="M141 264 C199 185 313 185 371 264 C313 333 199 333 141 264 Z"/>
    <path fill="url(#socket)" d="M152 264 C204 194 308 194 360 264 C308 324 204 324 152 264 Z"/>
    <g clip-path="url(#almond)">
      <circle cx="256" cy="255" r="90" fill="url(#glow)"/>
      <circle cx="256" cy="255" r="49" fill="url(#iris)"/>
      <g clip-path="url(#irisClip)">
        <circle cx="262" cy="292" r="40" fill="url(#irisLight)"/>
        <rect x="196" y="204" width="120" height="44" fill="url(#lidShade)"/>
      </g>
      <circle cx="256" cy="255" r="19" fill="#0D0942"/>
      <circle cx="239" cy="238" r="9.5" fill="#FFFFFF"/>
      <circle cx="274" cy="274" r="4" fill="#FFFFFF" fill-opacity="0.75"/>
    </g>
  </g>
</svg>
